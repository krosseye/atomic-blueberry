name: Build images
on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC every day
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".editorconfig"
      - "resources/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".editorconfig"
      - "resources/**"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe: [amd-intel.yml, nvidia.yml]
    steps:
      - name: Build ${{ matrix.recipe }}
        uses: blue-build/github-action@v1.14
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
