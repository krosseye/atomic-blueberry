---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: atomic-blueberry-nvidia
base-image: ghcr.io/ublue-os/kinoite-main
description: An image optimized for both battlestations and workstations, with Nvidia drivers built in.
image-version: 44

modules:
