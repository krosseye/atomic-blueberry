---
# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json

modules:
  - type: dnf
    repos:
      files:
        - vscodium.repo
    install:
      packages:
        - git
        - gh
        - git-lfs
        - codium

  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - io.github.dvlv.boxbuddyrs
          - org.gnome.Boxes

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - NerdFontsSymbolsOnly
